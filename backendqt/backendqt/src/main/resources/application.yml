spring:
  application:
    name: invoice-backend-core

  datasource:
    url: jdbc:postgresql://localhost:5432/invoice_db
    username: postgres
    password: .. #cập nhật mật khẩu theo postgres của bạn
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8081

app:
  jwt:
    secret: ${JWT_SECRET:invoice-core-development-secret-key-change-before-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:invoice-files}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
