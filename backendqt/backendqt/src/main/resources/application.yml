spring:
  application:
    name: invoice-backend-core

  datasource:
    url: jdbc:postgresql://localhost:5432/invoice_db
    username: postgres
    password: MinhHoai1011& #cập nhật mật khẩu theo postgres của bạn
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8081

app:
  demo-admin:
    enabled: ${DEMO_ADMIN_ENABLED:true}
    username: ${DEMO_ADMIN_USERNAME:admin}
    password: ${DEMO_ADMIN_PASSWORD:Admin@123456}
    email: ${DEMO_ADMIN_EMAIL:admin@smartinvoice.local}
  jwt:
    secret: ${JWT_SECRET:invoice-core-development-secret-key-change-before-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:invoices}

# AI providers are intentionally configured through environment variables so
# provider credentials are never committed to source control.
ai:
  provider: ${AI_PROVIDER:ollama}
  request-timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:60}
  max-image-size-bytes: ${AI_MAX_IMAGE_SIZE_BYTES:10485760}
  ollama:
    base-url: ${AI_OLLAMA_BASE_URL:http://127.0.0.1:11434}
    model: ${AI_OLLAMA_MODEL:qwen3-vl:8b}
  cloud:
    base-url: ${AI_CLOUD_BASE_URL:}
    api-key: ${AI_CLOUD_API_KEY:}
    model: ${AI_CLOUD_MODEL:}
    chat-completions-path: ${AI_CLOUD_CHAT_COMPLETIONS_PATH:/chat/completions}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
