spring:
  application:
    name: invoice-backend-core

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      # Multipart boundaries and headers add overhead beyond the file itself.
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:12MB}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:invoice_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update #validate/update/create
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${SERVER_PORT:8081}

app:
  demo-admin:
    enabled: ${DEMO_ADMIN_ENABLED:false}
    username: ${DEMO_ADMIN_USERNAME:admin}
    password: ${DEMO_ADMIN_PASSWORD:}
    email: ${DEMO_ADMIN_EMAIL:admin@smartinvoice.local}
  demo-users:
    enabled: ${DEMO_USERS_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:invoices}

# AI providers are intentionally configured through environment variables so
# provider credentials are never committed to source control.
ai:
  provider: ${AI_PROVIDER:ollama}
  request-timeout: ${AI_TIMEOUT:120s}
  max-image-size-bytes: ${AI_MAX_IMAGE_SIZE_BYTES:10485760}
  ocr:
    enabled: ${OCR_ENABLED:true}
    data-path: ${TESSDATA_PATH:./tessdata}
    language: ${OCR_LANGUAGE:${TESSERACT_LANGUAGE:vie+eng}}
    max-prompt-words: ${OCR_MAX_PROMPT_WORDS:600}
    minimum-text-length: ${OCR_MINIMUM_TEXT_LENGTH:40}
    good-confidence: ${OCR_GOOD_CONFIDENCE:0.65}
    reserved-output-tokens: ${AI_RESERVED_OUTPUT_TOKENS:3072}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen3-vl:8b}
    think: ${OLLAMA_THINK:false}
    num-predict: ${OLLAMA_NUM_PREDICT:3072}
    num-context: ${OLLAMA_NUM_CONTEXT:8192}
  cloud:
    base-url: ${AI_CLOUD_BASE_URL:}
    api-key: ${AI_CLOUD_API_KEY:}
    model: ${AI_CLOUD_MODEL:}
    chat-completions-path: ${AI_CLOUD_CHAT_COMPLETIONS_PATH:/chat/completions}
    timeout: ${AI_CLOUD_TIMEOUT:120s}
  document:
    high-confidence-threshold: ${AI_HIGH_CONFIDENCE_THRESHOLD:0.90}
    review-threshold: ${AI_REVIEW_THRESHOLD:0.75}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
